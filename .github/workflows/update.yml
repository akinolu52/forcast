name: Refresh league ratings

on:
  # openfootball commits results within a day or two of each round, so a
  # couple of runs a week keeps the current season fresh. Times are UTC.
  schedule:
    - cron: "0 6 * * 2"    # Tuesday 06:00
    - cron: "0 6 * * 6"    # Saturday 06:00
  # Manual trigger for testing / one-off refreshes.
  workflow_dispatch:
    inputs:
      league:
        description: "Which league to refresh"
        required: false
        default: "EPL"
        type: choice
        options:
          - EPL
          - LaLiga
          - SerieA
          - Bundesliga
          - Ligue1
          - all
      refresh:
        description: "Re-download cached seasons"
        required: false
        default: false
        type: boolean

concurrency:
  group: refresh-ratings
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Pick league(s)
        id: pick
        env:
          INPUT_LEAGUE: ${{ github.event.inputs.league }}
        run: |
          # Cron runs default to `all`; workflow_dispatch honors the input.
          if [ -z "${INPUT_LEAGUE}" ]; then
            echo "league=all" >> "$GITHUB_OUTPUT"
          else
            echo "league=${INPUT_LEAGUE}" >> "$GITHUB_OUTPUT"
          fi

      # Historical seasons never change, so keep them between runs. Only the
      # current-season file needs the network, and if the source is down we
      # can still rebuild from last run's copy.
      - name: Restore cached match CSVs
        uses: actions/cache/restore@v4
        with:
          path: data
          key: openfootball-${{ github.run_id }}
          restore-keys: openfootball-

      - name: Fetch match CSVs
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.refresh }}" = "true" ]; then
            FLAGS="--refresh"
          fi
          python scripts/fetch_data.py --league "${{ steps.pick.outputs.league }}" $FLAGS

      - name: Save match CSV cache
        if: always() && hashFiles('data/**') != ''
        uses: actions/cache/save@v4
        with:
          path: data
          key: openfootball-${{ github.run_id }}

      - name: Rebuild league JSON
        run: |
          python scripts/build_elo.py --league "${{ steps.pick.outputs.league }}"

      - name: Run predictor self-check
        run: python scripts/self_check.py

      - name: Commit and push if the payload changed
        run: |
          git config user.name  "forcast-bot"
          git config user.email "forcast-bot@users.noreply.github.com"

          git add docs/data/
          # Ignore the `generated` timestamp so a rebuild from cached CSVs
          # (source down, or simply no new results) doesn't publish a fresh
          # date over unchanged ratings.
          if git diff --cached --quiet -I '"generated":'; then
            echo "No changes to publish."
            exit 0
          fi

          # Include the league(s) refreshed in the commit subject so the
          # git log doubles as a refresh journal.
          LEAGUE="${{ steps.pick.outputs.league }}"
          git commit -m "data: refresh ${LEAGUE} ratings"
          git push
